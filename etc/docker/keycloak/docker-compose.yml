services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7
    restart: always
    command: [ "start-dev", "--import-realm" ]
    environment:
      # KC_BOOTSTRAP_ADMIN_* is the current, non-deprecated way to seed the initial admin user;
      # it supersedes the older KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD variables.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    logging:
      options:
        max-size: 10m
        max-file: 3
    ports:
      - 8081:8080
