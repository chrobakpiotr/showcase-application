# Local observability stack for the e-commerce showcase application.
# Start with: docker compose -f etc/docker/observability/docker-compose.yml up -d
# Prometheus scrapes the app's /actuator/prometheus endpoint on the management port (9081).
# The app exports traces via OTLP/HTTP to Tempo on port 4318 (see application-security.yml).
# Promtail ships every container's stdout on this Docker host to Loki (see
# promtail/promtail-config.yaml) - since the app itself runs on the host in this standalone
# topology (see the root README's "Option 2"), only the observability containers' own logs are
# collected here; run the root docker-compose.yml instead for the app's logs too.
# Grafana (http://localhost:3000, admin/admin) comes pre-provisioned with all three datasources
# and a starter "Showcase application - Overview" dashboard.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tempo:
    # Pinned to the latest 2.x release, not 3.0: Tempo 3.0 replaces the monolithic
    # ingester/compactor architecture with a new block-builder/live-store design and requires
    # removing the ingester/compactor config blocks below plus migrating the block format to
    # vParquet4 - a real migration, not a drop-in version bump. Not worth the added complexity
    # for this showcase's local-only, non-persistent tracing setup.
    # See https://grafana.com/docs/tempo/latest/setup/upgrade/#upgrade-to-tempo-30
    image: grafana/tempo:2.10.8
    container_name: ecommerce-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    container_name: ecommerce-loki
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    restart: unless-stopped

  promtail:
    # Promtail is end-of-life (EOL since March 2026, per Grafana's official announcement) - 3.6.11
    # is its final release, no further versions will ever be published. Grafana's replacement log
    # shipper is Alloy; migrating is a reasonable future step but out of scope for this bump.
    image: grafana/promtail:3.6.11
    container_name: ecommerce-promtail
    command: [ "-config.file=/etc/promtail/promtail-config.yaml" ]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only access to the Docker daemon's own API (service discovery) and the container log
      # files it writes to disk (the actual log content Promtail tails) - Promtail never starts,
      # stops, or otherwise controls containers through this socket, only reads.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
