version: "3.9"
services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=sa
      - POSTGRES_DB=test_db
    logging:
      options:
        max-size: 10m
        max-file: 3
    ports:
      - 5432:5432
