{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecommerce.fullname" . }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public application port - left reachable from anywhere *within the cluster's pod network* so
    # an Ingress controller running in its own namespace (when ingress.enabled) keeps working; this
    # does not expose anything beyond what the Service/Ingress already route to.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.appPort }}
    # Management/actuator port (health, metrics) - restricted to pods in this namespace. Note this
    # does not affect kubelet startup/liveness/readiness probes: on Calico/Cilium and most other
    # NetworkPolicy-enforcing CNIs, kubelet-originated probe traffic is exempted from pod ingress
    # policies by design (otherwise every restrictive policy would break health checks).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
  egress:
    # DNS - required for the JVM to resolve any hostname at all, in-cluster or external.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Same-namespace dependencies - Postgres/RabbitMQ/Redis/Keycloak/Tempo (see
    # etc/k8s/dev-dependencies.yaml); adjust networkPolicy.egressPorts if env.* is pointed at
    # externally-hosted services instead, which would need a separate rule keyed by IP/CIDR.
    - to:
        - podSelector: {}
      ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
