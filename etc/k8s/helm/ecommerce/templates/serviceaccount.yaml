{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce.serviceAccountName" . }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API, so it has no need for its pod's auto-mounted
# token (an unnecessary credential/attack surface otherwise sitting in every pod's filesystem).
automountServiceAccountToken: false
{{- end }}
