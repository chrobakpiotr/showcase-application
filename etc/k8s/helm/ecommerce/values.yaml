# Default values for the ecommerce Helm chart.

replicaCount: 1

image:
  # Build locally with `docker build -t ecommerce-showcase:local .` (repo root Dockerfile) and
  # load it into your cluster (e.g. `kind load docker-image ecommerce-showcase:local`), or push
  # to a registry and set repository/tag accordingly.
  repository: ecommerce-showcase
  tag: local
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "ecommerce"

# Spring profile(s) activated in-cluster. "k8s" resolves Postgres/RabbitMQ/Redis/Keycloak/Tempo
# hostnames from the env vars below, defaulting to in-cluster Service DNS names matching this
# chart's releaseName-based conventions (see application-k8s.yml).
springProfilesActive: "k8s"

service:
  type: ClusterIP
  appPort: 9080
  managementPort: 9081

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ecommerce.local
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    path: /actuator/health
    port: 9081
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health
    port: 9081
    periodSeconds: 10
  readiness:
    path: /actuator/health
    port: 9081
    periodSeconds: 10

# On SIGTERM, kubelet removes the pod's endpoints (readiness "false") and starts this grace period
# in parallel - meaning traffic can still land for up to one readiness periodSeconds (10s above)
# after shutdown begins. preStopSleepSeconds pads that gap with a plain "keep serving, just don't
# advertise as ready" sleep before the app is actually asked to shut down, so in-flight and
# briefly-late-arriving requests aren't dropped mid-rollout. terminationGracePeriodSeconds must
# comfortably cover preStopSleepSeconds + spring.lifecycle.timeout-per-shutdown-phase
# (application.yml, 30s) plus a buffer for the JVM to actually exit - kubelet SIGKILLs the process
# the instant this budget is exceeded, so going lower here would risk truncating Spring's own
# graceful drain.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 45

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Voluntary-disruption budget (node drains, cluster upgrades, `kubectl evict`). Left disabled by
# default since it only makes sense once more than one replica is actually running - a minAvailable
# of 1 with replicaCount: 1 would block every voluntary eviction outright. Turn it on together with
# replicaCount > 1 or autoscaling.enabled.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# NetworkPolicy restricting the pod's ingress/egress traffic to what it actually needs. Disabled by
# default because enforcement depends entirely on the cluster's CNI (Calico, Cilium, etc.) -
# vanilla `kind`'s default `kindnet` CNI silently ignores NetworkPolicy resources rather than
# enforcing them, so this is opt-in rather than a default that would give a false sense of security.
# egressPorts lists the TCP ports of same-namespace dependencies the pod is allowed to reach,
# defaulting to Postgres/RabbitMQ/Keycloak/Tempo-OTLP from dev-dependencies.yaml plus Redis (see
# ADR 0010); DNS (port 53) is always allowed separately so name resolution keeps working.
networkPolicy:
  enabled: false
  egressPorts:
    - 5432 # Postgres
    - 5672 # RabbitMQ
    - 6379 # Redis
    - 8080 # Keycloak
    - 4318 # Tempo OTLP/HTTP

# Connection details for dependent services. Defaults assume Postgres/RabbitMQ/Redis/Keycloak/
# Tempo are deployed as their own Services in the same namespace, named as below (bring your own
# manifests, a Bitnami chart, or reuse an external managed instance by overriding the host/port
# values).
env:
  dbHost: ecommerce-postgres
  dbPort: "5432"
  dbName: test_db
  dbUsername: sa
  # For a real deployment, put this in a Secret instead (see secret.yaml) and reference it via
  # extraEnvFrom, rather than plain values.yaml.
  dbPassword: sa

  rabbitmqHost: ecommerce-rabbitmq
  rabbitmqPort: "5672"
  rabbitmqUsername: sa
  rabbitmqPassword: sa

  # Distributed cache (see ADR 0010) - required so every replica observes the same cached order
  # data once replicaCount > 1 or autoscaling is enabled. No credentials: this dev-oriented chart
  # ships an unauthenticated Redis, matching etc/k8s/dev-dependencies.yaml.
  redisHost: ecommerce-redis
  redisPort: "6379"

  oauth2IssuerUri: http://localhost:8081/realms/ecommerce
  oauth2JwkSetUri: http://ecommerce-keycloak:8080/realms/ecommerce/protocol/openid-connect/certs

  otlpTracingEndpoint: http://ecommerce-tempo:4318/v1/traces

# Extra environment variables/secret references merged in as-is (list of EnvVar objects).
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod Security Standards "restricted"-aligned hardening (see
# https://kubernetes.io/docs/concepts/security/pod-security-standards/). The container runs as a
# non-root user with a read-only root filesystem and no Linux capabilities; the JVM's only need for
# a writable path (java.io.tmpdir, and Tomcat's work directory) is satisfied by the "tmp" emptyDir
# volume in deployment.yaml rather than loosening readOnlyRootFilesystem.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
