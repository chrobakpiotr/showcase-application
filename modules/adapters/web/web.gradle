apply from: rootProject.file('tooling/quality/spotbugs/spotbugs.gradle')
apply from: rootProject.file('tooling/quality/checkstyle/checkstyle.gradle')
apply from: rootProject.file('tooling/quality/jacoco/jacoco.gradle')
apply from: rootProject.file('tooling/quality/spotless/spotless-java.gradle')
apply from: rootProject.file('tooling/quality/dependencycheck/dependencycheck.gradle')
apply from: rootProject.file('tooling/quality/pmd/pmd.gradle')
dependencies {
    implementation project(':adapter:security')
    implementation project(':adapter:common')
    implementation project(':adapter:mail')
    implementation project(':adapter:persistence')
    implementation project(':domain')

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'tools.jackson.core:jackson-core'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.orm:hibernate-core'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.springframework:spring-beans'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-web'
    testImplementation project(path: ":adapter:common", configuration: 'testArtifacts')
    testImplementation 'com.sun.mail:jakarta.mail'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework:spring-webmvc'
}

rootProject.configureTestDependencies(project)
