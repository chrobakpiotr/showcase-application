apply from: rootProject.file('etc/spotbugs/spotbugs.gradle')
apply from: rootProject.file('etc/checkstyle/checkstyle.gradle')
apply from: rootProject.file('etc/jacoco/jacoco.gradle')
apply from: rootProject.file('etc/spotless/spotless-java.gradle')
apply from: rootProject.file('etc/dependencycheck/dependencycheck.gradle')
apply from: rootProject.file('etc/pmd/pmd.gradle')
dependencies {

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation project(':adapter:common')
    implementation project(':domain')

    implementation 'com.google.code.gson:gson'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-file-starter'
    testImplementation project(path: ':adapter:common', configuration: 'testArtifacts')
}

rootProject.configureTestDependencies(project)
