apply from: rootProject.file('tooling/quality/spotbugs/spotbugs.gradle')
apply from: rootProject.file('tooling/quality/checkstyle/checkstyle.gradle')
apply from: rootProject.file('tooling/quality/jacoco/jacoco.gradle')
apply from: rootProject.file('tooling/quality/spotless/spotless-java.gradle')
apply from: rootProject.file('tooling/quality/dependencycheck/dependencycheck.gradle')
apply from: rootProject.file('tooling/quality/pmd/pmd.gradle')
dependencies {
    api project(':foundation')
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    api 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.google.code.gson:gson'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-micrometer'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter'
    implementation 'io.github.resilience4j:resilience4j-retry'
    implementation 'io.micrometer:micrometer-core'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-core'
    testImplementation project(':domain')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    // Parses contracts/asyncapi/asyncapi.yml in AsyncApiSchema (test fixture below) - version-managed via the
    // Spring Boot BOM (imported in configureDependencyManagement), already a transitive dependency of
    // every module's spring-boot-starter-test, declared explicitly here since it's now compiled against
    // directly rather than only used incidentally at runtime.
    testImplementation 'org.yaml:snakeyaml'
}

configurations {
    testArtifacts.extendsFrom testImplementation
}
tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}
artifacts {
    testArtifacts testJar
}

rootProject.configureTestDependencies(project)
