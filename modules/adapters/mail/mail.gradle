    implementation 'org.springframework.boot:spring-boot-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.integration:spring-integration-core'
    implementation 'org.springframework:spring-beans'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springframework:spring-web'
    testImplementation project(path: ":adapter:common", configuration: 'testArtifacts')
    testImplementation project(':adapter:web')
    testImplementation project(':adapter:amqp')
    testImplementation project(':adapter:aws')
    testImplementation project(':adapter:kafka')
    testImplementation project(':adapter:camel')
