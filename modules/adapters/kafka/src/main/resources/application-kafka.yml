service:
  kafka:
    enabled: true

spring:
  kafka:
    # Off by default in Spring Boot: without these, each Kafka producer send / @KafkaListener
    # consume starts its own disconnected trace instead of continuing the caller's, breaking the
    # HTTP -> saga -> Kafka trace chain in Tempo. Enabling them makes Spring for Apache Kafka's
    # built-in Micrometer Observation instrumentation inject/extract the W3C traceparent header on
    # every record automatically - no manual OpenTelemetry API calls needed.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
