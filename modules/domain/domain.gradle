apply from: rootProject.file('tooling/quality/spotbugs/spotbugs.gradle')
apply from: rootProject.file('tooling/quality/checkstyle/checkstyle.gradle')
apply from: rootProject.file('tooling/quality/spotless/spotless-java.gradle')
apply from: rootProject.file('tooling/quality/dependencycheck/dependencycheck.gradle')
apply from: rootProject.file('tooling/quality/pitest/pitest.gradle')
dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation project(':adapter:common')
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework:spring-context'
    testImplementation project(':adapter:persistence')
    testImplementation project(':adapter:web')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'junit'
    }
    testImplementation 'com.tngtech.archunit:archunit'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

pitest {
    targetClasses = ['com.cp.ecommerce.domain.*']
    mutationThreshold = 100
}
