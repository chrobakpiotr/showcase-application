# Full containerized stack for the e-commerce showcase: the application itself plus
# Postgres, RabbitMQ, Kafka, Redis, Keycloak and the observability stack (Prometheus/Tempo/Grafana),
# all sharing one Docker network.
#
# Start with:   docker compose up -d --build
# Stop with:    docker compose down
#
# The app is reachable at http://localhost:9080/home (Swagger UI at /home/swagger-ui.html),
# actuator at http://localhost:9081/actuator, Keycloak admin console at http://localhost:8081,
# Grafana at http://localhost:3000 (admin/admin, anonymous access enabled).
#
# For infra-only setups (running the app from an IDE instead), see the standalone compose
# files under etc/docker/{postgres,rabbitmq,redis,keycloak,observability} - those use
# host.docker.internal to reach the app running on the host rather than in this network.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "9080:9080"
      - "9081:9081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      tempo:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=sa
      - POSTGRES_DB=test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sa -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=sa
      - RABBITMQ_DEFAULT_PASS=sa
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: ecommerce-kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_LISTENERS=CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092" ]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: ecommerce-keycloak
    restart: unless-stopped
    command: [ "start-dev", "--import-realm" ]
    environment:
      # KC_BOOTSTRAP_ADMIN_* is the current, non-deprecated way to seed the initial admin user;
      # it supersedes the older KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD variables.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./etc/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./etc/docker/observability/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    # Pinned to the latest 2.x release, not 3.0: Tempo 3.0 replaces the monolithic
    # ingester/compactor architecture with a new block-builder/live-store design and requires
    # removing the ingester/compactor config blocks below plus migrating the block format to
    # vParquet4 - a real migration, not a drop-in version bump. Not worth the added complexity
    # for this showcase's local-only, non-persistent tracing setup.
    # See https://grafana.com/docs/tempo/latest/setup/upgrade/#upgrade-to-tempo-30
    image: grafana/tempo:2.10.8
    container_name: ecommerce-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./etc/docker/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.7.7
    container_name: ecommerce-loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./etc/docker/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  promtail:
    # Promtail is end-of-life (EOL since March 2026, per Grafana's official announcement) - 3.6.11
    # is its final release, no further versions will ever be published. Grafana's replacement log
    # shipper is Alloy; migrating is a reasonable future step but out of scope for this bump.
    image: grafana/promtail:3.6.11
    container_name: ecommerce-promtail
    restart: unless-stopped
    command: [ "-config.file=/etc/promtail/promtail-config.yaml" ]
    volumes:
      - ./etc/docker/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only access to the Docker daemon's own API (service discovery) and the container log
      # files it writes to disk (the actual log content Promtail tails) - Promtail never starts,
      # stops, or otherwise controls containers through this socket, only reads. This is what
      # picks up the "app" service's own JSON stdout (see logging.structured.format.console in
      # application-docker.yml) alongside every other container's.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./etc/docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki

  # ---- AWS LocalStack stack (opt-in: docker compose --profile aws up) ----
  #
  # Start with: docker compose --profile aws up -d localstack
  #             docker compose --profile aws up terraform
  #
  # When these services run they share the same Docker network as the rest of the stack,
  # so inter-container traffic uses service names (http://localstack:4566).
  # The Spring Boot app running on the HOST (./gradlew bootRun) reaches LocalStack via
  # the published port: http://localhost:4566 - the same dual-endpoint pattern used by
  # Keycloak above (issuer-uri uses localhost:8081, jwk-set-uri uses keycloak:8080).

  localstack:
    # Pinned to the last free "Community" edition release (pre-March-2026 unification).
    # LocalStack's newer CalVer-tagged images (e.g. 2026.x.y) require a LOCALSTACK_AUTH_TOKEN
    # for ALL usage, even the community-tier services used here (s3/sqs/secretsmanager) - that
    # would break the zero-friction "just clone and run" local dev/demo experience this project
    # aims for. See https://localstack.cloud/2026-updates for background.
    image: localstack/localstack:4.14.0
    container_name: ecommerce-localstack
    profiles: ["aws"]
    environment:
      - SERVICES=s3,sqs,secretsmanager
      - DEBUG=0
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  terraform:
    image: hashicorp/terraform:1.16
    container_name: ecommerce-terraform
    profiles: ["aws"]
    depends_on:
      localstack:
        condition: service_healthy
    # Mount read-write so Terraform can write .terraform/ and state files.
    # State files and the .terraform lock file are git-ignored (see .gitignore).
    volumes:
      - ./etc/terraform:/workspace
    working_dir: /workspace
    environment:
      # Container-to-container endpoint: Terraform runs inside Docker, so it reaches
      # LocalStack via the service name on port 4566, NOT via localhost.
      # (The Terraform provider's default localstack_endpoint variable is overridden here.)
      - TF_VAR_localstack_endpoint=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["sh", "-c", "terraform init && terraform apply -auto-approve"]

  # ---- Chaos testing (opt-in: docker compose --profile chaos up -d toxiproxy) ----
  #
  # Toxiproxy sits in front of RabbitMQ so latency/timeouts/connection resets can be injected on
  # demand via its HTTP control API (http://localhost:8474), to demonstrate the Resilience4j
  # circuit breaker around SendOrderMessageAdapter opening under fault conditions. See the "Chaos
  # testing" section of the README for the full walkthrough.
  #
  # The app must be recreated with the extra "chaos" profile to route through the proxy:
  #   SPRING_PROFILES_ACTIVE=docker,chaos docker compose up -d --force-recreate app
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: ecommerce-toxiproxy
    profiles: ["chaos"]
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./etc/docker/chaos/toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474"
      - "25672:25672"
    depends_on:
      - rabbitmq

  # ---- Local AI features: order-remarks triage + customer-support assistant (opt-in: docker compose
  #      --profile ai up -d ollama) ----
  #
  # Ollama serves small local models for OrderRemarksClassifierAdapter's best-effort saga step (see
  # ADR 0019) and SupportAssistantAdapter's retrieval-augmented support chatbot (see ADR 0020). Runs
  # fully locally - no API key, no external SaaS dependency - matching the same zero-friction "just clone
  # and run" local dev/demo experience the AWS LocalStack stack above aims for.
  #
  # Enable the app's AI features with the matching "ai-ollama" Spring profile, e.g.:
  #   SPRING_PROFILES_ACTIVE=postgres-amqp-local,ai-ollama ./gradlew bootRun
  #
  # The app itself pulls the configured chat and embedding models on first startup if missing (see
  # application-ai-ollama.yml's spring.ai.ollama.init.pull-model-strategy) - no separate one-shot "pull"
  # container needed here.
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ecommerce-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  # Named (not bind-mounted like the rest of this file's volumes) so the multi-hundred-MB model download
  # survives `docker compose down` (without -v) instead of being re-pulled on every restart.
  ollama-data:
