@if (authService.isAuthenticated()) {
<header>
  <nav>
    <a routerLink="/order">Orders</a>
    @if (authService.roles().includes('ORDER_READ')) {
    <a routerLink="/analytics">Analytics Assistant</a>
    } @if (authService.roles().includes('CATALOG_READ')) {
    <a routerLink="/catalog">Catalog</a>
    }
    <span>Welcome, {{ authService.username() }}</span>
    <button type="button" (click)="logout()">Logout</button>
  </nav>
</header>
}
<main>
  <router-outlet />
</main>
