apply from: '../../etc/spotbugs.gradle'
apply from: '../../etc/checkstyle/checkstyle.gradle'
apply from: '../../etc/jacoco.gradle'
apply from: '../../etc/spotless/spotless-java.gradle'
apply from: '../../etc/dependencycheck/dependencycheck.gradle'
apply from: '../../etc/pmd/pmd.gradle'

dependencies {

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    implementation project(':adapter:common')
    implementation project(':domain')

    implementation 'com.google.code.gson:gson'
    implementation 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    // spring-boot-starter-kafka (not the bare spring-kafka library) is required: Spring Boot 4
    // split per-technology autoconfiguration out of spring-boot-autoconfigure into dedicated
    // modules (e.g. spring-boot-kafka, spring-boot-amqp), each pulled in transitively by its
    // starter. Without it there is no KafkaAutoConfiguration to supply the KafkaTemplate bean.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.slf4j:slf4j-api'
    testImplementation project(path: ':adapter:common', configuration: 'testArtifacts')
}

configureTestDependencies(project)
