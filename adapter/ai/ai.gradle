apply from: '../../etc/spotbugs.gradle'
apply from: '../../etc/checkstyle/checkstyle.gradle'
apply from: '../../etc/jacoco.gradle'
apply from: '../../etc/spotless/spotless-java.gradle'
apply from: '../../etc/dependencycheck/dependencycheck.gradle'
apply from: '../../etc/pmd/pmd.gradle'

dependencies {

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation project(':adapter:common')
    implementation project(':domain')

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    // Ollama runs fully locally (no API key, no external SaaS dependency) - fits this feature's
    // opt-in, self-contained scope. Swapping in a hosted provider (OpenAI/Bedrock/etc.) later would
    // only require adding its starter here and a new adapter implementing ClassifyOrderRemarksOutPort.
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    testImplementation project(path: ':adapter:common', configuration: 'testArtifacts')
}

rootProject.configureTestDependencies(project)
