apply from: '../../etc/spotbugs.gradle'
apply from: '../../etc/checkstyle/checkstyle.gradle'
apply from: '../../etc/jacoco.gradle'
apply from: '../../etc/spotless/spotless-java.gradle'
apply from: '../../etc/dependencycheck/dependencycheck.gradle'
apply from: '../../etc/pmd/pmd.gradle'

dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.google.code.gson:gson'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-core'
    implementation 'io.github.resilience4j:resilience4j-micrometer'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter'
    implementation 'io.github.resilience4j:resilience4j-retry'
    implementation 'io.micrometer:micrometer-core'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core'
    implementation 'org.assertj:assertj-core'
    implementation 'org.projectlombok:lombok'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-core'
    testImplementation project(':domain')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    // Parses etc/asyncapi/asyncapi.yml in AsyncApiSchema (test fixture below) - version-managed via the
    // Spring Boot BOM (imported in configureDependencyManagement), already a transitive dependency of
    // every module's spring-boot-starter-test, declared explicitly here since it's now compiled against
    // directly rather than only used incidentally at runtime.
    testImplementation 'org.yaml:snakeyaml'
}

configurations {
    testArtifacts.extendsFrom testCompile
}
tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}
artifacts {
    testArtifacts testJar
}

rootProject.configureTestDependencies(project)
