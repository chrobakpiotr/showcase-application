apply plugin: 'info.solidsoft.pitest'

pitest {
    junit5PluginVersion = '1.2.3'
    pitestVersion = '1.30.0'
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 100
    // PIT launches its own child JVMs, independently from Gradle Test tasks.
    // Explicitly attach Mockito there too so JDK 25 never needs dynamic self-attach.
    jvmArgs = ["-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"]
}
