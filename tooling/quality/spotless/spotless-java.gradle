apply plugin: 'com.diffplug.spotless'

spotless {
    // Java Spotless is an explicit formatting gate in CI/pre-push rather than an
    // implicit child of `check`. This keeps formatter classloaders away from the
    // multi-module `clean build` graph (diffplug/spotless#2850).
    enforceCheck = false

    java {
        importOrderFile rootProject.file("./tooling/quality/spotless/importorder")
        eclipse().configFile rootProject.file("./tooling/quality/spotless/eclipse-formatter.xml")
        target 'src/main/**/*.java', 'src/test/**/*.java'
        endWithNewline()
    }
}
