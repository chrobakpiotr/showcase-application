server:
  port: 9080
  compression:
    enabled: true
  shutdown: graceful
  servlet:
    context-path: "/home"
  tomcat:
    additional-tld-skip-patterns: '*.jar'

spring:
  lifecycle:
    # Upper bound Spring waits for in-flight requests, the RabbitMQ listener container and
    # scheduled tasks to finish once shutdown starts (server.shutdown: graceful above), before
    # forcing them to stop anyway. Made explicit rather than relying on Boot's identical 30s
    # default so the deployment's terminationGracePeriodSeconds (see etc/k8s/helm/ecommerce -
    # deliberately larger to also cover the preStop delay and process exit) can be reasoned about
    # without having to know Boot's implicit default.
    timeout-per-shutdown-phase: 30s
  config:
    import:
      classpath:application-security.yml,classpath:application-mail.yml,classpath:application-camel.yml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration, org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration, org.springdoc.core.configuration.SpringDocHateoasConfiguration
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 10
          initial-interval: 5000
  # This app is classic blocking Spring MVC/Tomcat with blocking JDBC/JPA, RestTemplate and RabbitMQ
  # listener I/O throughout - the textbook fit for virtual threads (JEP 444). Tomcat's request-handling
  # threads and Boot's auto-configured task executor/scheduler pick this up automatically; the
  # AMQP listener container needs its own opt-in wiring since it's manually built (see
  # MessagingConfiguration) - see ADR 0011 for the full rationale and caveats (e.g. HikariCP pool size
  # remains the real DB-concurrency ceiling and is intentionally unchanged).
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true

cache:
  enabled: true
  provider: ehcache

# See adapter/persistence's application-persistence.yml for why this is disabled by default (this
# duplicate exists because the postgres/docker/k8s profiles don't import application-persistence.yml).
management:
  health:
    redis:
      enabled: false
