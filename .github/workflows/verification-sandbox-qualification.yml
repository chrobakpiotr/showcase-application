name: Verification sandbox target qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-sandbox-qualification-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  qualify-github-runner:
    name: Qualify this exact GitHub-hosted runner job
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SHOWCASE_WORKLOAD_IMAGE: python@sha256:9d72651cf7018c1f6a1dd6fd02bd68286631c33620bc0f37b0675b21aab915d5
      SHOWCASE_QUALIFICATION_EVIDENCE_ROOT: docs/specs/AH5-04B-QUAL-001/evidence/github-runner/${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install pinned Harness qualification checker
        run: python3 -m pip install -r tooling/agent-harness/requirements.txt

      - name: Run all target qualification checks
        run: bash tooling/scripts/run-verification-sandbox-qualification.sh --target github-runner --all-checks

      - name: Upload this job's qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-sandbox-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/specs/AH5-04B-QUAL-001/evidence/github-runner/${{ github.run_id }}-attempt-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
