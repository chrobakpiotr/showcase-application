name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Test Markdown link checker
        run: python3 -m unittest discover -s etc/scripts/tests -p 'test_check_markdown_links.py' -v

      - name: Check README and docs links
        run: python3 etc/scripts/check_markdown_links.py

  backend:
    name: Backend build, quality gates & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Java formatting
        run: ./gradlew spotlessJavaCheck --no-configuration-cache --no-parallel

      - name: Build, verify quality gates and run tests
        run: >
          ./gradlew clean build
          -x :adapter:ecommerce-frontend:npm_run_build
          -x :adapter:ecommerce-frontend:npm_run_test
          -x :adapter:ecommerce-frontend:runESLintCheck
          -x :adapter:ecommerce-frontend:runUnitTests
          -x :adapter:ecommerce-frontend:spotlessStylingCheck
          -x :adapter:ecommerce-frontend:spotlessStyling
          --continue

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish static analysis reports (Checkstyle, PMD, SpotBugs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-static-analysis-reports
          path: |
            **/build/reports/checkstyle/
            **/build/reports/pmd/
            **/build/reports/spotbugs/
          retention-days: 14
          if-no-files-found: ignore

  dependency-check:
    name: OWASP dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run OWASP DependencyCheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --continue
        continue-on-error: true

      - name: Publish DependencyCheck reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: '**/build/reports/security/'
          retention-days: 14
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review (new/changed dependencies on PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the PR check if a newly introduced/changed dependency (any ecosystem: Gradle, npm,
      # Docker base image, ...) carries a known vulnerability or an incompatible license, without
      # waiting for the full OWASP DependencyCheck/SBOM jobs which scan the whole dependency tree
      # regardless of what actually changed in this PR.
      - name: Run dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sbom:
    name: CycloneDX SBOM generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Publish SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            **/build/reports/cyclonedx/
            **/build/reports/cyclonedx-direct/
          retention-days: 14
          if-no-files-found: ignore

  infra-validation:
    name: Infra-as-config validation (Docker, Helm, Terraform, AsyncAPI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Building the actual container image (not just compiling the jar) catches issues that unit
      # tests alone can't, e.g. missing Boot auto-configuration starters that only bite once the
      # app boots inside its real Docker image / classpath.
      - name: Build container image
        run: docker build -t showcase-application:ci .

      - name: Validate docker-compose files
        run: |
          docker compose config -q
          for f in infra/docker/*/docker-compose.yml; do
            echo "Validating $f"
            docker compose -f "$f" config -q
          done

      - name: Validate dev-only Kubernetes manifests (kubeconform)
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -summary -strict infra/k8s/dev-dependencies.yaml

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint and render Helm chart
        run: |
          helm lint infra/k8s/helm/ecommerce
          helm template infra/k8s/helm/ecommerce > /dev/null
          helm template infra/k8s/helm/ecommerce \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true > /dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate Terraform (LocalStack provisioning)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate AsyncAPI spec
        run: npx --yes @asyncapi/cli validate contracts/asyncapi/asyncapi.yml

  container-image-scan:
    name: Container image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build -t showcase-application:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: showcase-application:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Report-only for now (doesn't fail the build) - the base eclipse-temurin image's CVE
          # backlog isn't something this showcase project controls the remediation timeline for;
          # the scan's value here is visibility, matching the OWASP DependencyCheck job's
          # continue-on-error stance on the same tradeoff for source dependencies.
          exit-code: '0'

  frontend:
    name: Frontend build, lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ecommerce/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ecommerce/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit tests (headless Chrome)
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

      - name: Build
        run: npm run build

      - name: Publish frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-report
          path: apps/ecommerce/frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_COMPOSE_FILE: infra/docker/e2e/docker-compose.yml
      COMPOSE_PROJECT_NAME: showcase-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the real app image but uses a disposable, E2E-only dependency topology.
      # Observability UIs/log shipping are intentionally excluded because they do not
      # participate in the browser contract under test.
      - name: Start disposable E2E application stack
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --build

      - name: Wait for app to become healthy
        run: |
          for _ in $(seq 1 30); do
            app_id=$(docker compose -f "$E2E_COMPOSE_FILE" ps -q app)
            status=$(docker inspect --format='{{.State.Health.Status}}' "$app_id" 2>/dev/null || echo starting)
            echo "app health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::E2E app did not become healthy in time"
          docker compose -f "$E2E_COMPOSE_FILE" logs app
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ecommerce/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/ecommerce/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/ecommerce/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        working-directory: apps/ecommerce/frontend
        run: npm run e2e

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/ecommerce/frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump application logs on failure
        if: failure()
        run: docker compose -f "$E2E_COMPOSE_FILE" logs app

      - name: Tear down disposable E2E stack
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v --remove-orphans
