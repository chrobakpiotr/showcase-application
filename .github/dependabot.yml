version: 2
updates:
  # Backend: Gradle modules (root build.gradle manages the whole multi-module build)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  # Frontend: Angular application
  - package-ecosystem: "npm"
    directory: "/adapter/ecommerce-frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"

  # Container base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Terraform provider (AWS/LocalStack provisioning, see etc/terraform)
  - package-ecosystem: "terraform"
    directory: "/etc/terraform"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"

  # CI/CD workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
