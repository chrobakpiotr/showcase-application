name: Install private Harness
description: Install the pinned Harness without exposing checkout credentials to pip.
inputs:
  token:
    description: Read-only token scoped to chrobakpiotr/agent-harness
    required: true
runs:
  using: composite
  steps:
    - name: Resolve pinned Harness
      id: harness
      shell: bash
      env:
        HARNESS_READ_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$HARNESS_READ_TOKEN" ]; then
          echo "::error::Set HARNESS_READ_TOKEN with Contents: read access to chrobakpiotr/agent-harness. Fork pull requests do not receive this secret."
          exit 1
        fi
        python3 - <<'PYTHON'
        import os
        import re
        from pathlib import Path
        requirements = Path("tooling/agent-harness/requirements.txt").read_text().splitlines()
        pins = [match.group(1) for line in requirements
                if (match := re.fullmatch(r"agent-harness\[grants\] @ git\+https://github\.com/chrobakpiotr/agent-harness\.git@([0-9a-f]{40})", line))]
        if len(pins) != 1:
            raise SystemExit("Expected exactly one full-SHA agent-harness dependency")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print(f"sha={pins[0]}", file=output)
        PYTHON

    - name: Checkout pinned private Harness
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: chrobakpiotr/agent-harness
        ref: ${{ steps.harness.outputs.sha }}
        token: ${{ inputs.token }}
        path: .ci/agent-harness
        persist-credentials: false

    - name: Install from local checkout
      shell: bash
      env:
        HARNESS_SHA: ${{ steps.harness.outputs.sha }}
      run: |
        test "$(git -C .ci/agent-harness rev-parse HEAD)" = "$HARNESS_SHA"
        # Install the verified checkout by path. A pip VCS install through a `url.<file>.insteadOf` rewrite of
        # this shallow checkout made pip clone with `--filter=blob:none`; the local transport ignores the
        # filter but the clone still became a promisor clone that fetched every missing blob in its own
        # `git fetch` subprocess (thousands of fetches, 9-12 minutes per job; see
        # agent-harness docs/specs/release-0.22.0/ci-followup.md). The pinned commit identity is still
        # enforced: the single full SHA from requirements.txt, the authenticated checkout of exactly that
        # commit, the `rev-parse` check above and the version check below. Credentials are not available
        # to pip; the remaining pins (cryptography) install from requirements.txt unchanged.
        python3 -m pip install --no-deps ".ci/agent-harness[grants]"
        python3 -m pip install -r <(grep -v '^agent-harness' tooling/agent-harness/requirements.txt)
        python3 - <<'PYTHON'
        import json, os, subprocess
        import agent_harness
        git = lambda *a: subprocess.run(['git', '-C', '.ci/agent-harness', *a], check=True, capture_output=True, text=True).stdout
        commit = git('rev-parse', 'HEAD').strip()
        assert commit == os.environ['HARNESS_SHA'], commit
        assert f'__version__ = "{agent_harness.__version__}"' in git('show', 'HEAD:src/agent_harness/__init__.py'), agent_harness.__version__
        print(json.dumps({'agent_harness': agent_harness.__version__, 'commit': commit}))
        PYTHON
