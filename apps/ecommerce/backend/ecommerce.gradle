import org.cyclonedx.model.Component

apply plugin: 'com.gorylenko.gradle-git-properties'
apply plugin: 'org.gradle.test-retry'
apply from: rootProject.file('tooling/quality/spotless/spotless-java.gradle')
apply from: rootProject.file('tooling/quality/dependencycheck/dependencycheck.gradle')
// Docker builds don't include the .git directory in their build context (see .dockerignore),
// so don't fail the build when it's absent - just skip generating git.properties in that case.
gitProperties {
    failOnNoGitDirectory = false
}

// This module produces the actual deployable Spring Boot jar (every other module is a library
// dependency of it), so its own CycloneDX component is an application, not a library.
tasks.cyclonedxDirectBom {
    projectType = Component.Type.APPLICATION
}

evaluationDependsOn(':adapter:ecommerce-frontend')

rootProject.configureBootProject(project, 'ecommerce')


sourceSets.main {
    // Bundle generated Angular assets directly into the deployable Spring Boot application.
    resources {
        srcDirs = [
            project(':adapter:ecommerce-frontend').sourceSets.generated.resources
        ] + srcDirs
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework:spring-context'
    api 'org.springframework.boot:spring-boot-security'

    implementation project(':adapter:security')
    implementation project(':adapter:mail')
    implementation project(':adapter:persistence')
    implementation project(':adapter:web')
    implementation project(':domain')
    implementation project(':adapter:amqp')
    implementation project(':adapter:aws')
    implementation project(':adapter:kafka')
    implementation project(':adapter:camel')
    implementation project(':adapter:ai')

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation project(path: ":adapter:common", configuration: 'testArtifacts')
    testImplementation 'jakarta.persistence:jakarta.persistence-api'
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.hibernate.orm:hibernate-core'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'junit', module: 'junit'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.data:spring-data-jpa'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation project(':adapter:common')
    testImplementation project(':adapter:persistence')
    testImplementation project(':domain')
    testImplementation project(':adapter:web')
    testImplementation project(':application:orchestration')
    testImplementation 'org.liquibase:liquibase-core'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
}

processResources.dependsOn(':adapter:ecommerce-frontend:processGeneratedResources')

rootProject.configureBootTasks(project)

// This module's tests spin up a real Postgres container via Testcontainers, which occasionally
// fails for purely environmental reasons (Docker daemon cold-start latency, container port
// binding races, etc.) rather than a genuine regression. Retry failed tests up to twice before
// failing the build, but only for tests that failed at least once and passed on retry - a test
// that fails consistently on every attempt still fails the build as normal.
test {
    // The dedicated Postgres gate must execute these Testcontainers tests fresh, but
    // global --rerun-tasks also rebuilds every dependency task and defeats the build cache.
    // Force only this Test task fresh; compilation and the rest of the graph remain cacheable.
    if (providers.gradleProperty('criticalPostgresGate').getOrElse('false').toBoolean()) {
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }

    retry {
        maxRetries = 2
        maxFailures = 5
        failOnPassedAfterRetry = false
    }
}
