# Fully containerized profile used by the root docker-compose.yml.
# Environment-specific service addresses live here; adapter resource files contain only
# technology/capability configuration shared with other environments.
spring:
  config:
    import:
      classpath:application-persistence-postgres.yml,classpath:application-amqp.yml,classpath:application-kafka.yml,classpath:application-cache-redis.yml,classpath:application-json-logging.yml
  datasource:
    url: "jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:test_db}"
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sa}
    password: ${RABBITMQ_PASSWORD:sa}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  liquibase:
    # Docker Compose is a local showcase environment, so it opts into deterministic demo fixtures.
    contexts: local,demo

service:
  mail:
    enabled: false

security:
  oauth2:
    # Must match tokens issued through the host-published Keycloak endpoint.
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/realms/ecommerce}
    # Server-to-server JWK fetch uses the internal Docker service address.
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs}

observability:
  otlp:
    tracing-endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
