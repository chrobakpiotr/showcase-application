# Profile for running the fully containerized app (see root Dockerfile / docker-compose.yml)
# against dockerized Postgres, RabbitMQ, Kafka, Redis, Keycloak and the observability stack, all
# sharing the same Docker network.
spring:
  config:
    # Structured JSON console output (see modules/adapters/security/application-json-logging.yml) so
    # Promtail/Loki (infra/docker/observability) can parse fields directly instead of scraping raw
    # text - a containerized deployment's stdout is the natural place log-shipping agents tail
    # from. Imported directly (rather than via spring.profiles.include, which Boot disallows in a
    # profile-specific document such as this one) alongside the rest of this profile's config.
    import:
      classpath:application.yml,classpath:application-persistence-postgres-docker.yml,classpath:application-amqp-docker.yml,classpath:application-kafka-docker.yml,classpath:application-cache-redis-docker.yml,classpath:application-json-logging.yml
  liquibase:
    # Docker Compose is a local showcase environment, so it explicitly opts into deterministic
    # demo fixtures. Production-like profiles such as k8s do not include the demo context.
    contexts: local,demo

service:
  mail:
    enabled: false

security:
  oauth2:
    # Must match the "iss" claim of tokens issued by Keycloak, i.e. whatever host:port the
    # browser/API client used to obtain them (Keycloak is published on the host at 8081).
    issuer-uri: http://localhost:8081/realms/ecommerce
    # Used for the actual (server-to-server) JWK set fetch, so it uses the internal Docker
    # network service name instead, which is reachable from within the app container.
    jwk-set-uri: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs

observability:
  otlp:
    # Tempo (see infra/docker/observability) is in the same Docker network in this topology.
    tracing-endpoint: http://tempo:4318/v1/traces
