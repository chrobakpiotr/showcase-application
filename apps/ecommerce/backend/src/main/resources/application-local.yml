# Host-based development profile.
# Run infrastructure in Docker and the Spring Boot application from the IDE/Gradle on the host.
# This is the single standard local profile: Postgres + RabbitMQ + Kafka + Redis, while Keycloak
# and OTLP keep their localhost defaults from application-security.yml.
spring:
  config:
    import:
      classpath:application-persistence-postgres.yml,classpath:application-amqp.yml,classpath:application-kafka.yml,classpath:application-cache-redis.yml
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:test_db}"
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sa}
    password: ${RABBITMQ_PASSWORD:sa}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  liquibase:
    contexts: local,demo

service:
  mail:
    enabled: false
